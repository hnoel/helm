---
replicaCount: 2

image:
  repository: ghcr.io/hnoel/kanban
  tag: "main"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  httpPort: 80
  userPort: 8080
  httpsPort: 443
  queuePort: 8443

route:
  enabled: true
  host: example.com # à surcharger en prod
  tls: true

resources:
  limits:
    cpu: "2"
    memory: "2Gi"
  requests:
    cpu: "1"
    memory: "1Gi"

env:
  - name: queue_port
    value: 8443
  - name: user_port
    value: 8080
...
