---
# SPDX-License-Identifier: AGPL-3.0-or-later
# ---
replicaCount: 2
namespace: hnoel-dev
name: sceau

image:
  repository: ghcr.io/hnoel/sceau
  tag: "main"
  pullPolicy: Always

imagePullSecrets:
  - name: my-registry

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  extHttpPort: 8088
  intHttpPort: "httpd-svc-port"

# Used by the container env vars SCEAU_VERSION/SCEAU_DATE in the template
sceau:
  typeBd: mysql
  version: debug
  date: "01/01/1970"
# Used by the template for the httpd container-specific settings
httpd:
  image:
    repository: ghcr.io/hnoel/sceau
    tag: "latest-frontend"
    pullPolicy: Always
  resources: {}

route:
  enabled: true
  host: '' #example.com # à surcharger en prod
  tls: true

resources:
  limits:
    cpu: "2"
    memory: "2Gi"
  requests:
    cpu: "1"
    memory: "1Gi"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

env:
  - name: MARIADB_DATABASE
    value: 'change_me'
  - name: MARIADB_USER
    value: 'change_me'
  - name: MARIADB_PASSWORD
    value: 'change_me'
  - name: MARIADB_ROOT_PASSWORD
    value: 'change_me'

secret:
  name: sceau.secrets

mariadb:
  #global:
  #  security:
  #    allowInsecureImages: true
  replicaCount: 1
  image:
    registry: docker.io
    repository: bitnami/mariadb
    tag: "latest"
    pullPolicy: IfNotPresent
  architecture: standalone
  auth:
    database: appdb
    username: appuser
    password: change-me
    rootPassword: change-me-root
  initdbScripts: {}
  tde:
    enabled: false
  primary:
    name: mariadb
    service:
      type: ClusterIP
      ports:
        mysql: 3306
    persistence:
      enabled: true
      storageClass: "standard"
      size: 1Gi
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 256Mi
...
