---
kind: Service
apiVersion: v1
apiVersion: apps/v1
metadata:
  name: {{ include "sceau.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "sceau.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    helm.sh/chart: {{ include "sceau.chart" . }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.extHttpPort }}
      protocol: TCP
      targetPort: {{ .Values.service.intHttpPort }}
  sessionAffinity: None
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  internalTrafficPolicy: Cluster
  selector:
    app: {{ .Chart.Name }}
...
